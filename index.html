<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <header>
        <h1>Student Manager</h1>
        <ul class="menu">
            <a href="index.html">Главная</a>
            <a href="#">Студенты</a>
            <a href="#">О нас</a>
        </ul>        
    </header>
    <main>
<div class="card">
  <h2>Добавить студента</h2>

  <form>
    <div class="form-grid">
      <div class="field">
        <label>Имя</label>
        <input type="text" placeholder="Введите имя">
      </div>

      <div class="field">
        <label>Фамилия</label>
        <input type="text" placeholder="Введите фамилию">
      </div>

      <div class="field">
        <label>Email</label>
        <input type="text" placeholder="Введите email">
      </div>

      <div class="field">
        <label>Группа</label>
        <input type="text" placeholder="Например: IT-24">
      </div>
    </div>

    <div>
      <button type="button">Добавить студента</button>
    </div>
  </form>
</div>

    </main>

</body>
</html>
